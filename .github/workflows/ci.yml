name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (pure Go)
        run: go build ./...
      - name: Build (WASM client)
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/qorm-wasm
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test (race detector)
        run: go test -race ./...

  per-commit-build:
    name: per-commit buildability (bisect guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the range walk needs full history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Red-team audit found a02237e unbuildable (render-side component changes
      # landed before their model-side counterparts), which breaks git bisect.
      # Build each commit of the push/PR range in a detached worktree (no
      # stash, main checkout untouched) so a repeat is caught here.
      # Trade-off: this repo mostly lands single-commit PRs / squash merges,
      # so the range is capped at the 20 newest commits to bound job time;
      # anything unbuildable deeper in the range is not checked.
      - name: Build every commit in range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # `before` is all-zero on newly pushed branches (and can go stale on
          # force-push); fall back to HEAD~1 so the pushed tip is still checked.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          TOTAL=$(git rev-list --count "$BASE"..HEAD)
          if [ "$TOTAL" -gt 20 ]; then
            echo "::warning::range has $TOTAL commits; checking the 20 newest only"
          fi
          COMMITS=$(git rev-list "$BASE"..HEAD | head -n 20)
          echo "checking $(echo "$COMMITS" | grep -c . || true) commit(s) in $BASE..HEAD"
          WT="$(mktemp -d)"
          trap 'git worktree remove --force "$WT" 2>/dev/null || true' EXIT
          for SHA in $COMMITS; do
            echo "::group::build $(git log -1 --format='%h %s' "$SHA")"
            git worktree add --detach --force "$WT" "$SHA" >/dev/null
            if ! (cd "$WT" && go build ./...); then
              echo "::error::commit $SHA does not build: $(git log -1 --format=%s "$SHA")"
              exit 1
            fi
            # release the worktree before the next iteration reuses the path
            git worktree remove --force "$WT"
            echo "::endgroup::"
          done

  desktop:
    name: build (native desktop, cgo)
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 pinned: the vendored webview binding needs the
        # webkit2gtk-4.0 pkg-config profile, which 24.04 no longer ships.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config
      - name: Build (-tags desktop)
        run: go build -tags desktop ./cmd/qorm
      - name: Smoke (run counter headless)
        # The script probes ./qorm.exe itself when ./qorm is absent (Windows).
        run: bash scripts/ci-smoke.sh ./qorm
      - name: Smoke (MCP manifest policy)
        run: bash scripts/ci-smoke-mcp.sh ./qorm

  binaries:
    name: cross-compile (downloadable artifacts)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # so build-all.sh can `git describe` the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile every platform
        run: ./scripts/build-all.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: qorm-binaries
          path: dist/*
          retention-days: 30
